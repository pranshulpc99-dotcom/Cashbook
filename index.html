<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drashti Cashbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF8; --paper-raised: #FFFFFF; --ink: #1E2229; --ink-soft: #66707C;
    --navy: #17518F; --navy-soft: #2E75BD; --gold: #C79A46; --gold-soft: #F1E0BB;
    --rule: #E3E1D6; --rule-strong: #CFCBBA; --credit: #1F6F63; --credit-bg: #E4F0EC;
    --debit: #C6373F; --debit-bg: #FBE8E8; --danger: #C6373F;
    --radius-s: 10px; --radius-m: 16px; --radius-l: 22px;
    --glass-surface: rgba(255,255,255,0.55); --glass-border: rgba(255,255,255,0.65); --glass-highlight: rgba(255,255,255,0.55);
    --font-serif: 'Fraunces', Georgia, serif; --font-sans: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  :root[data-theme="dark"] {
    --glass-surface: rgba(27,33,42,0.45); --glass-border: rgba(255,255,255,0.14); --glass-highlight: rgba(255,255,255,0.14);
  }
  :root[data-theme="dark"] {
    --paper: #12161C; --paper-raised: #1B212A; --ink: #E9ECF1; --ink-soft: #97A2B0;
    --navy: #5B9BD9; --navy-soft: #7FB3E8; --gold: #D9B562; --gold-soft: #4A3C22;
    --rule: #2A3441; --rule-strong: #3C4A5C; --credit: #4FBF9F; --credit-bg: #12332B;
    --debit: #E8767A; --debit-bg: #3A1C1E; --danger: #E8767A;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; background: var(--paper); }
  body { margin: 0; background: transparent; color: var(--ink); font-family: var(--font-sans); min-height: 100vh; position: relative; overflow-x: hidden; }
  .bg-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.28; z-index: 0; pointer-events: none; transition: opacity .3s ease; will-change: transform; }
  :root[data-theme="dark"] .bg-blob { opacity: 0.24; }
  .bg-blob.b1 { width: 380px; height: 380px; background: var(--navy); top: -120px; left: -100px; animation: blobDrift1 10s ease-in-out infinite alternate; }
  .bg-blob.b2 { width: 340px; height: 340px; background: var(--navy-soft); bottom: -120px; right: -80px; animation: blobDrift2 12s ease-in-out infinite alternate; }
  .bg-blob.b3 { width: 300px; height: 300px; background: var(--gold); top: 30%; right: -140px; animation: blobDrift3 8s ease-in-out infinite alternate; }
  @keyframes blobDrift1 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,90px) scale(1.15); } 100% { transform: translate(30px,-40px) scale(0.95); } }
  @keyframes blobDrift2 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px,-60px) scale(1.1); } 100% { transform: translate(-30px,50px) scale(0.92); } }
  @keyframes blobDrift3 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,80px) scale(1.2); } 100% { transform: translate(40px,30px) scale(0.9); } }
  @media (prefers-reduced-motion: reduce) { .bg-blob { animation: none !important; } }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 18px 72px; position: relative; z-index: 1; }
  @keyframes viewFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 18px; margin-bottom: 24px; border-bottom: 4px solid transparent; border-image: linear-gradient(90deg, var(--gold), var(--navy) 45%, var(--gold)) 1; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 600; color: var(--navy); }
  .brand-sub { font-size: 0.9rem; color: var(--ink-soft); }
  .who { display: flex; align-items: center; gap: 10px; font-size: 1rem; flex-wrap: wrap; }
  .who-name { font-weight: 600; color: var(--ink); }
  .btn { font-family: var(--font-sans); font-size: 0.95rem; font-weight: 600; padding: 11px 20px; border-radius: var(--radius-s); border: 1px solid var(--rule-strong); background: linear-gradient(160deg, var(--paper-raised), var(--paper)); color: var(--ink); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .15s ease; }
  .btn:hover { border-color: var(--navy); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(23,81,143,0.12); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .btn-primary { position: relative; overflow: hidden; background: rgba(255,255,255,0.22); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,0.5); color: var(--navy); font-weight: 700; box-shadow: 0 8px 24px rgba(23,81,143,0.28), inset 0 1px 0 rgba(255,255,255,0.65); }
  .btn-primary::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at var(--mx, 30%) var(--my, 30%), rgba(255,255,255,0.6), rgba(255,255,255,0) 60%); pointer-events: none; transition: background .05s linear; }
  :root[data-theme="dark"] .btn-primary { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.2); color: var(--navy); box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18); }
  .btn-primary:hover { background: rgba(255,255,255,0.32); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(23,81,143,0.34), inset 0 1px 0 rgba(255,255,255,0.75); }
  :root[data-theme="dark"] .btn-primary:hover { background: rgba(255,255,255,0.14); }
  .btn-small { padding: 7px 14px; font-size: 0.85rem; border-radius: 999px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .login-shell { max-width: 460px; margin: 8vh auto 0; }
  .login-card { background: linear-gradient(160deg, var(--paper-raised), var(--paper)); border: 1px solid var(--rule); border-radius: var(--radius-l); padding: 38px 32px; box-shadow: 0 12px 30px rgba(23,81,143,0.08); }
  .login-title { font-family: var(--font-serif); font-size: 1.85rem; margin: 0 0 6px; color: var(--navy); }
  .login-hint { color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 24px; }
  label { display: block; font-size: 0.88rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  select, input[type="text"], input[type="number"], input[type="password"], input[type="date"] {
    width: 100%; font-family: var(--font-sans); font-size: 1.05rem; padding: 13px 15px;
    border-radius: var(--radius-s); border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); margin-bottom: 18px;
  }
  .field-row { display: flex; gap: 12px; } .field-row > div { flex: 1; }
  .error-msg { color: var(--danger); font-size: 0.92rem; margin: -10px 0 16px; min-height: 1em; }
  .muted-note { color: var(--ink-soft); font-size: 0.88rem; margin-top: 4px; }
  .link-btn { background: none; border: none; color: var(--navy); font-size: 0.9rem; cursor: pointer; padding: 0; text-decoration: underline; }
  .balance-band { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; background: linear-gradient(160deg, var(--paper-raised), var(--paper)); border: 1px solid var(--rule); border-radius: var(--radius-l); padding: 26px 28px; margin-bottom: 26px; box-shadow: 0 10px 24px rgba(23,81,143,0.06); }
  .balance-figure-label { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 5px; }
  .balance-figure { font-family: var(--font-serif); font-size: 3rem; font-weight: 600; background: linear-gradient(135deg, var(--navy), var(--navy-soft)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; line-height: 1; }
  .balance-sub { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .balance-sub-item { font-size: 0.92rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; } .balance-sub-item b { color: var(--ink); font-weight: 700; }
  .glass-chip { padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; }
  .glass-in { background: rgba(31,111,99,0.16); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); border: 1px solid rgba(31,111,99,0.35); }
  .glass-out { background: rgba(198,55,63,0.14); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); border: 1px solid rgba(198,55,63,0.35); }
  .pill-in { color: var(--credit); } .pill-out { color: var(--debit); }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--rule); }
  .tab-btn { font-family: var(--font-sans); font-size: 1rem; font-weight: 600; color: var(--ink-soft); background: none; border: none; padding: 12px 4px; margin-right: 24px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
  .tab-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: linear-gradient(135deg, var(--debit), #a92c33); color: #fff; font-size: 0.78rem; font-weight: 700; margin-left: 8px; vertical-align: middle; line-height: 1; box-shadow: 0 2px 6px rgba(198,55,63,0.35); }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .brand-mark { width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--gold); box-shadow: 0 3px 8px rgba(199,154,70,0.35); background: #fff; }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar { border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 700; flex: none; box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
  .form-card { background: linear-gradient(160deg, var(--paper-raised), var(--paper)); border: 1px solid var(--rule); border-radius: var(--radius-l); padding: 24px 26px; margin-bottom: 26px; box-shadow: 0 8px 20px rgba(23,81,143,0.05); }
  .form-card h3 { font-family: var(--font-serif); font-size: 1.3rem; margin: 0 0 18px; font-weight: 600; }
  .type-toggle { display: flex; gap: 10px; margin-bottom: 18px; }
  .type-opt { position: relative; overflow: hidden; flex: 1; text-align: center; padding: 13px; border-radius: var(--radius-s); border: 1px solid var(--rule-strong); cursor: pointer; font-size: 0.98rem; font-weight: 600; background: var(--paper); color: var(--ink-soft); transition: transform .12s ease; }
  .type-opt::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.55), rgba(255,255,255,0) 60%); opacity: 0; transition: opacity .2s ease, background .05s linear; }
  .type-opt:hover::before { opacity: 1; }
  .type-opt:hover { transform: translateY(-1px); }
  .type-opt.active-in { background: rgba(31,111,99,0.16); backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%); border-color: var(--credit); color: var(--credit); }
  .type-opt.active-out { background: rgba(198,55,63,0.14); backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%); border-color: var(--debit); color: var(--debit); }
  .ledger-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius-l); background: var(--paper-raised); }
  table.ledger { width: 100%; border-collapse: collapse; min-width: 720px; }
  table.ledger th { text-align: left; font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); padding: 13px 16px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; background: var(--paper); cursor: pointer; user-select: none; }
  table.ledger th:hover { color: var(--navy); }
  table.ledger td { padding: 13px 16px; font-size: 0.98rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.ledger tr:last-child td { border-bottom: none; }
  table.ledger td.num { font-family: var(--font-serif); color: var(--ink-soft); }
  table.ledger td.amt-in .glass-chip { color: var(--credit); font-weight: 600; }
  table.ledger td.amt-out .glass-chip { color: var(--debit); font-weight: 600; }
  .dash { color: var(--rule-strong); }
  .empty-row td { text-align: center; color: var(--ink-soft); padding: 32px; }
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .emp-card { background: linear-gradient(160deg, var(--paper-raised), var(--paper)); border: 1px solid var(--rule); border-radius: var(--radius-l); padding: 20px 22px; cursor: pointer; text-align: left; font-family: var(--font-sans); transition: transform .12s ease, box-shadow .12s ease; box-shadow: 0 6px 16px rgba(23,81,143,0.05); }
  .emp-card:hover { border-color: var(--navy); transform: translateY(-2px); box-shadow: 0 10px 22px rgba(23,81,143,0.12); }
  .emp-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .emp-card-name { font-weight: 600; font-size: 1.02rem; color: var(--ink); }
  .emp-card-balance { font-family: var(--font-serif); font-size: 1.65rem; font-weight: 600; color: var(--navy); }
  .emp-card-meta { font-size: 0.85rem; color: var(--ink-soft); margin-top: 8px; }
  .section-title { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 600; margin: 0 0 16px; color: var(--ink); }
  .row-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--navy); background: none; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 16px; }
  .totals-strip { display: flex; gap: 28px; margin-bottom: 20px; flex-wrap: wrap; }
  .totals-strip div { font-size: 0.95rem; color: var(--ink-soft); } .totals-strip b { color: var(--ink); font-family: var(--font-serif); font-size: 1.2rem; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,10,10,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-card { background: linear-gradient(160deg, var(--paper-raised), var(--paper)); border-radius: var(--radius-l); padding: 30px 28px; max-width: 400px; width: 100%; border: 1px solid var(--rule); box-shadow: 0 16px 36px rgba(23,81,143,0.18); }
  .modal-card h3 { font-family: var(--font-serif); margin: 0 0 8px; font-size: 1.35rem; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--ink), #33291f); color: var(--paper); padding: 12px 22px; border-radius: 999px; font-size: 0.92rem; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 60; box-shadow: 0 8px 20px rgba(0,0,0,0.25); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .sync-note { font-size: 0.8rem; color: var(--ink-soft); margin-top: -12px; margin-bottom: 20px; }
  .app-footer { text-align: center; font-family: var(--font-serif); font-style: italic; font-size: 0.95rem; color: var(--gold); letter-spacing: 0.3px; padding: 18px 16px 34px; opacity: 0.85; position: relative; z-index: 1; }
  .search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .search-row input { margin-bottom: 0; flex: 1; min-width: 200px; }
  @media (max-width: 560px) { html { font-size: 16.5px; } .balance-figure { font-size: 2.2rem; } .field-row { flex-direction: column; } .balance-band { padding: 18px; } }
</style>
</head>

function showToast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3200); }
function fmtMoney(n) { const v = Number(n) || 0; return '\u20B9' + v.toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtTime(createdAtIso) { if (!createdAtIso) return ''; const d = new Date(createdAtIso); if (isNaN(d)) return ''; return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function initialsOf(name) { return (name || '').split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase(); }

/* ---------------- Theme ---------------- */
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('drashti-theme'); } catch (e) {}
  const theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('drashti-theme', next); } catch (e) {}
  render();
}

/* ---------------- Avatar ---------------- */
function avatarChip(id, name, size) {
  size = size || 34;
  const bg = EMP_COLORS[id] || '#6B7280';
  return el('div', { class: 'avatar', style: 'width:' + size + 'px;height:' + size + 'px;background:' + bg + ';font-size:' + Math.round(size*0.4) + 'px;' }, initialsOf(name));
}

/* ---------------- API ---------------- */
async function api(action, payload) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) throw new Error('CONFIG');
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token }, payload || {}))
  });
  return res.json();
}

function checkForNewIncoming() {
  if (!current) return;
  const incomingIds = new Set(allTransfers.filter(t => t.toEmployeeId === current.id && t.status === 'pending').map(t => t.id));
  if (seenIncomingIds === null) { seenIncomingIds = incomingIds; return; }
  incomingIds.forEach(id => {
    if (!seenIncomingIds.has(id)) {
      const t = allTransfers.find(x => x.id === id);
      if (t) showToast((t.fromName || 'Someone') + ' sent you ' + fmtMoney(t.amount) + ' for approval');
    }
  });
  seenIncomingIds = incomingIds;
}
function isUserTyping() {
  const tag = document.activeElement && document.activeElement.tagName;
  return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
}
async function refreshAll() {
  try {
    const [txr, trr] = await Promise.all([api('listTransactions'), api('listTransfers')]);
    if (txr && txr.ok) allTxns = txr.transactions || [];
    if (trr && trr.ok) { allTransfers = trr.transfers || []; checkForNewIncoming(); }
    if (!isUserTyping()) render();
  } catch (e) { /* silent — keep last known data */ }
}
async function refreshTransfersOnly() {
  try {
    const trr = await api('listTransfers');
    if (trr && trr.ok) { allTransfers = trr.transfers || []; checkForNewIncoming(); }
    if (!isUserTyping()) render();
  } catch (e) { /* silent */ }
}
function startPolling() {
  stopPolling();
  pollTimer = setInterval(refreshAll, POLL_MS);
  fastPollTimer = setInterval(refreshTransfersOnly, FAST_POLL_MS);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (fastPollTimer) { clearInterval(fastPollTimer); fastPollTimer = null; }
}

function txnsFor(employeeId) { return allTxns.filter(t => t.employeeId === employeeId); }
function balanceFor(employeeId) {
  const list = txnsFor(employeeId);
  let inTotal = 0, outTotal = 0;
  list.forEach(t => { if (t.type === 'in') inTotal += Number(t.amount)||0; else outTotal += Number(t.amount)||0; });
  return { balance: inTotal - outTotal, inTotal, outTotal, count: list.length };
}

/* ---------------- Animated balance ---------------- */
function animateBalanceInto(spanEl, employeeId, toVal) {
  const fromVal = lastRenderedBalance[employeeId] !== undefined ? lastRenderedBalance[employeeId] : toVal;
  lastRenderedBalance[employeeId] = toVal;
  if (fromVal === toVal) { spanEl.textContent = fmtMoney(toVal); return; }
  const duration = 650, start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    spanEl.textContent = fmtMoney(Math.round(fromVal + (toVal - fromVal) * eased));
    if (t < 1) requestAnimationFrame(step); else spanEl.textContent = fmtMoney(toVal);
  }
  requestAnimationFrame(step);
}

/* ---------------- CSV / PDF export ---------------- */
function toCSV(list) {
  const rows = [['Txn No','Date','Time','Amount','Collected From','Handover To','Purpose']];
  list.forEach(t => rows.push([t.number, t.date, fmtTime(t.createdAt), t.amount, t.collectedFrom || '', t.handoverTo || '', t.purpose || '']));
  const esc = v => '"' + String(v).replace(/"/g,'""') + '"';
  return rows.map(r => r.map(esc).join(',')).join('\n');
}
function exportCSV(employeeId, employeeName) {
  const csv = toCSV(txnsFor(employeeId));
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Drashti-Cashbook-' + employeeName.replace(/\s+/g,'-') + '-' + todayISO() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportPDF(employeeName, list, balance) {

/* ---------------- Trend chart ---------------- */
function buildTrendChartSVG(txns) {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const perDay = days.map(d => {
    const key = dayKey(d); let inSum = 0, outSum = 0;
    txns.forEach(t => { if (t.date === key) { if (t.type === 'in') inSum += Number(t.amount)||0; else outSum += Number(t.amount)||0; } });
    return { label: d.toLocaleDateString('en-IN', { weekday: 'short' }), inSum, outSum };
  });
  const max = Math.max(1, ...perDay.map(d => Math.max(d.inSum, d.outSum)));
  const w = 560, h = 170, gap = 76, baseY = h - 28;
  let bars = '';
  perDay.forEach((d, i) => {
    const x = 24 + i * gap;
    const inH = Math.round((d.inSum / max) * 110), outH = Math.round((d.outSum / max) * 110);
    bars += '<rect x="' + x + '" y="' + (baseY - inH) + '" width="16" height="' + inH + '" rx="4" style="fill:var(--credit)" opacity="0.85"/>';
    bars += '<rect x="' + (x + 20) + '" y="' + (baseY - outH) + '" width="16" height="' + outH + '" rx="4" style="fill:var(--debit)" opacity="0.85"/>';
    bars += '<text x="' + (x + 18) + '" y="' + (baseY + 18) + '" font-size="11" style="fill:var(--ink-soft)" text-anchor="middle" font-family="Work Sans, sans-serif">' + d.label + '</text>';
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;max-width:560px;display:block;">' +
    '<line x1="10" y1="' + baseY + '" x2="' + (w-10) + '" y2="' + baseY + '" style="stroke:var(--rule-strong)" stroke-width="1"/>' + bars + '</svg>';
}

    filtered.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'amount' || sortKey === 'number') { av = Number(av)||0; bv = Number(bv)||0; }
      else { av = String(av||'').toLowerCase(); bv = String(bv||'').toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    tbody.innerHTML = '';
    if (!filtered.length) {
      tbody.appendChild(el('tr', { class: 'empty-row' }, el('td', { colspan: '7' }, list.length ? 'No matching entries.' : 'No entries yet.')));
      return;
    }
    filtered.forEach(t => {
      tbody.appendChild(el('tr', {},
        el('td', { class: 'num' }, String(t.number)),
        el('td', {}, fmtDate(t.date)),
        el('td', {}, fmtTime(t.createdAt) || el('span', { class: 'dash' }, '\u2014')),
        el('td', { class: t.type === 'in' ? 'amt-in' : 'amt-out' }, el('span', { class: 'glass-chip ' + (t.type === 'in' ? 'glass-in' : 'glass-out') }, (t.type === 'in' ? '+' : '\u2212') + fmtMoney(t.amount))),
        el('td', {}, t.collectedFrom ? t.collectedFrom : el('span', { class: 'dash' }, '\u2014')),
        el('td', {}, t.handoverTo ? t.handoverTo : el('span', { class: 'dash' }, '\u2014')),
        el('td', {}, t.purpose || el('span', { class: 'dash' }, '\u2014'))
      ));
    });
  }
  cols.forEach(c => {
    theadRow.appendChild(el('th', { onclick: () => { if (sortKey === c.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc'; else { sortKey = c.key; sortDir = 'desc'; } renderRows(); } },
      c.label + (sortKey === c.key ? (sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : '')
    ));
  });
  searchInput.addEventListener('input', () => { search = searchInput.value; renderRows(); });
  renderRows();
  container.appendChild(wrap);
  return container;
}

/* ---------------- Master overview ---------------- */
function renderMaster() {
  root.appendChild(topbar());
  root.appendChild(tabsBar('master'));
  root.appendChild(el('div', { class: 'sync-note' }, 'Live figures \u2014 ledger refreshes automatically every 2 minutes.'));
  const grand = EMPLOYEES.reduce((acc, e) => { const b = balanceFor(e.id); acc.balance += b.balance; acc.in += b.inTotal; acc.out += b.outTotal; return acc; }, { balance: 0, in: 0, out: 0 });
  root.appendChild(el('div', { class: 'totals-strip' },
    el('div', {}, 'Total cash in hand (all staff)', el('br'), el('b', {}, fmtMoney(grand.balance))),
    el('div', {}, 'Total collected', el('br'), el('b', {}, fmtMoney(grand.in))),
    el('div', {}, 'Total handed over', el('br'), el('b', {}, fmtMoney(grand.out)))
  ));

  const chartCard = el('div', { class: 'form-card' }, el('h3', {}, 'Last 7 days \u2014 company-wide'));
  const chartHolder = el('div', {});
  chartHolder.innerHTML = buildTrendChartSVG(allTxns);
  chartCard.appendChild(chartHolder);
  root.appendChild(chartCard);

  root.appendChild(el('div', { class: 'row-between' }, el('div', { class: 'section-title' }, 'By employee')));
  const grid = el('div', { class: 'overview-grid' });
  EMPLOYEES.forEach(e => {
    const b = balanceFor(e.id);
    grid.appendChild(el('button', { class: 'emp-card', onclick: () => { masterFocusId = e.id; view='ledger-detail'; render(); } },
      el('div', { class: 'emp-card-top' }, avatarChip(e.id, e.name, 36), el('div', { class: 'emp-card-name' }, e.name + (e.isMaster ? ' \u00b7 Master' : ''))),
      el('div', { class: 'emp-card-balance' }, fmtMoney(b.balance)),
      el('div', { class: 'emp-card-meta' }, b.count + ' entries \u00b7 in ' + fmtMoney(b.inTotal) + ' / out ' + fmtMoney(b.outTotal))
    ));
  });
  root.appendChild(grid);
}
function renderLedgerDetail() {
  root.appendChild(topbar());
  const emp = EMPLOYEES.find(e => e.id === masterFocusId);
  root.appendChild(el('button', { class: 'back-link', onclick: () => { view='master'; render(); } }, '\u2190 Back to overview'));
  const b = balanceFor(emp.id);
  root.appendChild(balanceBand(emp.name + '\u2019s cash in hand', emp.id, b, {
    csv: () => exportCSV(emp.id, emp.name),
    pdf: () => exportPDF(emp.name, txnsFor(emp.id), b)
  }));
  root.appendChild(el('div', { class: 'section-title' }, 'Full ledger (read-only)'));
  root.appendChild(buildLedgerSection(txnsFor(emp.id)));
}

/* ---------------- Approvals ---------------- */
function statusBadge(status) {
  const color = status === 'approved' ? 'var(--credit)' : status === 'rejected' ? 'var(--debit)' : 'var(--gold)';
  return el('span', { style: 'color:' + color + ';font-weight:600;font-size:0.82rem' }, status.charAt(0).toUpperCase() + status.slice(1));
}
function transferRow(t, showActions) {
  const wrap = el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap' });
  const left = el('div', { style: 'display:flex;align-items:center;gap:10px' },
    avatarChip(t.fromEmployeeId, t.fromName, 30),
    el('div', {},
      el('div', { style: 'font-weight:600;font-size:0.92rem;color:var(--ink)' }, t.fromName + ' \u2192 ' + t.toName),
      el('div', { style: 'font-size:0.8rem;color:var(--ink-soft);margin-top:2px' }, fmtDate(t.date) + (t.purpose ? ' \u00b7 ' + t.purpose : ''))
    )
  );
  const right = el('div', { style: 'display:flex;align-items:center;gap:14px' },
    el('div', { style: 'font-family:var(--font-serif);font-weight:600;font-size:1.05rem' }, fmtMoney(t.amount))
  );
  if (showActions) {
    right.appendChild(el('button', { class: 'btn btn-small glass-in', style: 'color:var(--credit);border-color:var(--credit)', onclick: async (e) => {
      e.target.disabled = true;
      const r = await api('decideTransfer', { transferId: t.id, actingEmployeeId: current.id, decision: 'approved' });
      if (!r.ok) { showToast(r.error || 'Couldn\u2019t approve'); e.target.disabled = false; return; }
      showToast('Approved'); await refreshAll();
    } }, 'Approve'));
    right.appendChild(el('button', { class: 'btn btn-small glass-out', style: 'color:var(--debit);border-color:var(--debit)', onclick: async (e) => {
      e.target.disabled = true;
      const r = await api('decideTransfer', { transferId: t.id, actingEmployeeId: current.id, decision: 'rejected' });
      if (!r.ok) { showToast(r.error || 'Couldn\u2019t reject'); e.target.disabled = false; return; }
      showToast('Rejected'); await refreshAll();
    } }, 'Reject'));
  } else {
    right.appendChild(statusBadge(t.status));
  }
  wrap.appendChild(left); wrap.appendChild(right);
  return wrap;
}
function renderApprovals() {
  root.appendChild(topbar());
  root.appendChild(tabsBar('approvals'));
  root.appendChild(el('div', { class: 'sync-note' }, 'Live figures \u2014 approvals update automatically in the background.'));

  const incoming = allTransfers.filter(t => t.toEmployeeId === current.id && t.status === 'pending').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const sent = allTransfers.filter(t => t.fromEmployeeId === current.id).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  root.appendChild(el('div', { class: 'section-title' }, 'Waiting for your approval'));
  const incCard = el('div', { class: 'form-card' });
  if (!incoming.length) incCard.appendChild(el('div', { style: 'color:var(--ink-soft);font-size:0.88rem' }, 'Nothing waiting on you right now.'));
  else incoming.forEach(t => incCard.appendChild(transferRow(t, true)));
  root.appendChild(incCard);

  root.appendChild(el('div', { class: 'section-title' }, 'Sent by you'));
  const sentCard = el('div', { class: 'form-card' });
  if (!sent.length) sentCard.appendChild(el('div', { style: 'color:var(--ink-soft);font-size:0.88rem' }, 'You haven\u2019t sent any employee-to-employee entries yet.'));
  else sent.forEach(t => sentCard.appendChild(transferRow(t, false)));
  root.appendChild(sentCard);

  if (current.isMaster) {
    root.appendChild(el('div', { class: 'section-title' }, 'All transfers (oversight)'));
    const allCard = el('div', { class: 'form-card' });
    const allSorted = [...allTransfers].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (!allSorted.length) allCard.appendChild(el('div', { style: 'color:var(--ink-soft);font-size:0.88rem' }, 'No employee-to-employee entries yet.'));
    else allSorted.forEach(t => allCard.appendChild(transferRow(t, false)));
    root.appendChild(allCard);
  }
}

/* ---------------- Pointer-tracking glass highlight ---------------- */
document.addEventListener('pointermove', (e) => {
  const target = e.target.closest('.btn-primary, .type-opt');
  if (!target) return;
  const rect = target.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width) * 100;
  const my = ((e.clientY - rect.top) / rect.height) * 100;
  target.style.setProperty('--mx', mx + '%');
  target.style.setProperty('--my', my + '%');
});

/* ---------------- Boot ---------------- */
initTheme();
render();
</script>
